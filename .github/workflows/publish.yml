name: Build, publish and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install release validation dependency
        run: python -m pip install PyYAML

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ -z "${version}" ]; then
            echo "VERSION is empty."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release tree
        run: python scripts/release_validate.py

      - name: Validate README disclosure
        shell: bash
        run: |
          first_section="$(grep -m1 '^## ' README.md)"
          test "${first_section}" = "## AI-assisted development"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          python scripts/extract_release_notes.py \
            "${{ steps.version.outputs.tag }}" \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Check release state
        id: release_state
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }},suffix=
            type=raw,value=${{ steps.version.outputs.version }},enable=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create version tag
        if: steps.release_state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"

      - name: Verify existing tag points at this commit
        if: steps.release_state.outputs.tag_exists == 'true'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force
          tagged_commit="$(git rev-list -n 1 "${tag}")"
          if [ "${tagged_commit}" != "${GITHUB_SHA}" ]; then
            echo "Tag ${tag} already exists but points to ${tagged_commit}, not ${GITHUB_SHA}."
            echo "Bump VERSION before publishing a new release."
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.release_state.outputs.release_exists != 'true'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "${tag}" \
            --title "${tag}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag

      - name: Release already exists
        if: steps.release_state.outputs.release_exists == 'true'
        run: echo "GitHub Release ${{ steps.version.outputs.tag }} already exists; leaving it unchanged."
