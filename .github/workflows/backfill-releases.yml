name: Backfill historical GitHub Releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview missing Releases without creating them"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository with full tag history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Backfill missing Releases
        shell: bash
        run: |
          set -euo pipefail

          dry_run="${{ inputs.dry_run }}"
          created=0
          skipped=0
          missing_notes=0

          mapfile -t tags < <(git tag --list 'v*' --sort=version:refname)

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No v* tags found."
            exit 0
          fi

          echo "Found ${#tags[@]} version tag(s)."

          for tag in "${tags[@]}"; do
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "SKIP ${tag}: Release already exists."
              skipped=$((skipped + 1))
              continue
            fi

            notes_file="${RUNNER_TEMP}/release-${tag}.md"

            if python scripts/extract_release_notes.py "${tag}" --output "${notes_file}"; then
              note_source="CHANGELOG.md"
            else
              missing_notes=$((missing_notes + 1))
              cat > "${notes_file}" <<EOF
          ## ${tag}

          Historical release backfilled from the existing Git tag.

          This version predates exact per-version release notes in the current
          \`CHANGELOG.md\`. See the repository changelog for the consolidated
          history covering this development period.
          EOF
              note_source="historical fallback note"
            fi

            if [ "${dry_run}" = "true" ]; then
              echo "WOULD CREATE ${tag} (${note_source})"
              continue
            fi

            echo "CREATE ${tag} (${note_source})"
            gh release create "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}" \
              --verify-tag

            created=$((created + 1))
          done

          echo
          echo "Backfill complete."
          echo "Created: ${created}"
          echo "Already existed: ${skipped}"
          echo "Missing exact changelog sections: ${missing_notes}"
          echo "Dry run: ${dry_run}"
