name: Publish GitHub Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release validation dependency
        run: python -m pip install PyYAML
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})."
            exit 1
          fi
      - name: Validate release tree
        run: python scripts/release_validate.py
      - name: Extract release notes from CHANGELOG
        run: python scripts/extract_release_notes.py "${GITHUB_REF_NAME}" --output "${RUNNER_TEMP}/release-notes.md"
      - name: Create GitHub Release
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag
