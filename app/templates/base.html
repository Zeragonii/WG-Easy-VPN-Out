<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}VPN Router{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181b1f;
      --panel2: #20242a;
      --text: #eef1f4;
      --muted: #aeb6bf;
      --border: #30363d;
      --accent: #5da9ff;
      --good: #43c17a;
      --bad: #ef6b73;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header strong { font-size: 1.05rem; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .muted { color: var(--muted); }
    .status-good { color: var(--good); }
    .status-bad { color: var(--bad); }
    input, button {
      width: 100%;
      padding: .75rem;
      margin-top: .4rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #07111d;
      border: 0;
      font-weight: 700;
    }
    .inline-button {
      width: auto;
      padding: .45rem .75rem;
      margin: 0;
    }
    .flash {
      border: 1px solid var(--bad);
      background: color-mix(in srgb, var(--bad) 12%, var(--panel));
      padding: .75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    code {
      background: var(--panel2);
      padding: .15rem .35rem;
      border-radius: 5px;
    }
  </style>
</head>
<body>
<header>
  <strong>VPN Router</strong>
  {% if current_user.is_authenticated %}
  <form method="post" action="{{ url_for('auth.logout') }}">
    <button class="inline-button" type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
