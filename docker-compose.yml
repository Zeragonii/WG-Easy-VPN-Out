services:
  vpn-router:
    build: .
    # For GHCR deployments:
    # image: ghcr.io/zeragonii/wg-easy-vpn-out:latest
    container_name: vpn-router

    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      TZ: Europe/London
      VPN_ROUTER_PORT: "8085"
      VPN_ROUTER_BIND: "0.0.0.0"
      SECRET_KEY: "CHANGE-ME-TO-A-LONG-RANDOM-STRING"

      # Optional deployment-level override:
      # VPN_ROUTER_DATA_DIR: "/data"
      # Optional local MaxMind-compatible MMDB override:
      # VPN_ROUTER_GEOIP_DB: "/data/geoip/GeoLite2-City.mmdb"

      # Legacy v1.0 application environment variables are still imported on
      # upgrade when their corresponding database setting does not yet exist.

    volumes:
      - vpn-router-data:/data

    restart: unless-stopped

volumes:
  vpn-router-data:
